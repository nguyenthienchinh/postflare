name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not paste API keys, access tokens or app secrets.
        Security problems: report them privately via the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the composer
        2. Select a TikTok account and a video
        3. Schedule it
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Publishing to a platform
        - Connecting an account (OAuth / credentials)
        - Analytics
        - Web app (composer, calendar, media...)
        - Workspaces, users and roles
        - REST API / MCP
        - CLI (postflare / pf)
        - Deploy / configuration
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform(s) involved
      placeholder: e.g. Instagram (Instagram login), YouTube
  - type: textarea
    id: logs
    attributes:
      label: Publishing log / error messages
      description: The post's log from the post drawer, `wrangler tail` output or the CLI error (remove any tokens).
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Git commit of your deployment and/or `pf --version`.
  - type: dropdown
    id: plan
    attributes:
      label: Workers plan
      options:
        - Free
        - Paid
        - Local development
